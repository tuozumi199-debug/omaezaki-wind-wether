<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>池新田 風速予測</title>

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: #0f172a;
      color: #e5e7eb;
    }

    header {
      padding: 18px 16px 8px;
    }

    h1 {
      font-size: 22px;
      margin: 0 0 6px;
    }

    .sub {
      color: #94a3b8;
      font-size: 13px;
    }

    .card {
      background: #1e293b;
      margin: 12px;
      padding: 16px;
      border-radius: 18px;
      box-shadow: 0 8px 20px rgba(0,0,0,.25);
    }

    .big {
      font-size: 42px;
      font-weight: 700;
      line-height: 1.1;
    }

    .unit {
      font-size: 18px;
      color: #94a3b8;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .mini {
      background: #334155;
      padding: 12px;
      border-radius: 14px;
    }

    .label {
      font-size: 12px;
      color: #cbd5e1;
      margin-bottom: 4px;
    }

    .value {
      font-size: 22px;
      font-weight: 700;
    }

    .risk {
      font-size: 24px;
      font-weight: 700;
      padding: 12px;
      border-radius: 14px;
      text-align: center;
      margin-top: 12px;
    }

    .normal { background: #14532d; }
    .caution { background: #854d0e; }
    .warning { background: #7f1d1d; }
    .stop { background: #581c87; }

    button {
      width: calc(100% - 24px);
      margin: 12px;
      padding: 14px;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      background: #38bdf8;
      color: #082f49;
    }

    .chart-card {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 12px;
      margin-top: 12px;
    }

    .chart-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .chart-wrap {
      position: relative;
      height: 260px;
      width: 100%;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th, td {
      padding: 9px 4px;
      border-bottom: 1px solid #334155;
      text-align: right;
      vertical-align: top;
    }

    th:first-child, td:first-child {
      text-align: left;
      white-space: nowrap;
    }

    .bar-wrap {
      background: #334155;
      height: 8px;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 4px;
    }

    .bar {
      height: 8px;
      background: #38bdf8;
    }

    .gust-yellow {
      color: #facc15;
      font-weight: 700;
    }

    .gust-red {
      color: #f87171;
      font-weight: 700;
    }

    .error {
      background: #7f1d1d;
      color: #fee2e2;
      margin: 12px;
      padding: 12px;
      border-radius: 14px;
      display: none;
      font-size: 14px;
      line-height: 1.5;
    }

    footer {
      padding: 16px;
      color: #64748b;
      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <header>
    <h1>御前崎・池新田 風速予測</h1>
    <div class="sub">Open-Meteo API / 10m風速・突風・気温・降水量</div>
  </header>

  <div id="errorBox" class="error"></div>

  <section class="card">
    <div class="label">現在の風速</div>
    <div>
      <span id="currentWind" class="big">--</span>
      <span class="unit">m/s</span>
    </div>

    <div id="riskBox" class="risk normal">取得待ち</div>

    <div class="grid" style="margin-top:14px;">
      <div class="mini">
        <div class="label">現在の突風</div>
        <div class="value"><span id="currentGust">--</span> m/s</div>
      </div>
      <div class="mini">
        <div class="label">風向</div>
        <div class="value" id="currentDir">--</div>
      </div>
      <div class="mini">
        <div class="label">気温</div>
        <div class="value"><span id="currentTemp">--</span> ℃</div>
      </div>
      <div class="mini">
        <div class="label">天気</div>
        <div class="value" id="currentWeather">--</div>
      </div>
    </div>

    <div class="sub" style="margin-top:12px;">
      最終更新：<span id="updatedAt">--</span>
    </div>
  </section>

  <button onclick="loadWeather()">更新する</button>

  <section class="card">
    <div class="label">今日のグラフ</div>

    <div class="chart-card">
      <div class="chart-title">気温 + 降水量</div>
      <div class="chart-wrap">
        <canvas id="tempRainChart"></canvas>
      </div>
    </div>

    <div class="chart-card">
      <div class="chart-title">平均風速 + 突風</div>
      <div class="chart-wrap">
        <canvas id="windChart"></canvas>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="label">今後24時間</div>
    <table>
      <thead>
        <tr>
          <th>時刻</th>
          <th>風速</th>
          <th>突風</th>
        </tr>
      </thead>
      <tbody id="forecastRows"></tbody>
    </table>
  </section>

  <footer>
    このアプリは外部気象データを利用した運用判断支援ツールです。
    防災判断には気象庁などの公式情報を確認してください。
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>
    const LAT = 34.647;
    const LON = 138.126;

    let tempRainChart = null;
    let windChart = null;

    function degToDir(deg) {
      const dirs = [
        "北", "北北東", "北東", "東北東",
        "東", "東南東", "南東", "南南東",
        "南", "南南西", "南西", "西南西",
        "西", "西北西", "北西", "北北西"
      ];

      return dirs[Math.round(deg / 22.5) % 16];
    }

    function judgeRisk(wind, gust) {
      if (gust >= 20 || wind >= 14) {
        return { text: "停止推奨", cls: "stop" };
      }
      if (gust >= 15 || wind >= 10) {
        return { text: "警戒", cls: "warning" };
      }
      if (gust >= 10 || wind >= 7) {
        return { text: "注意", cls: "caution" };
      }
      return { text: "通常", cls: "normal" };
    }

    function weatherText(code) {
      const map = {
        0: "快晴",
        1: "晴",
        2: "一部曇",
        3: "曇",
        45: "霧",
        48: "霧氷",
        51: "弱い霧雨",
        53: "霧雨",
        55: "強い霧雨",
        61: "弱い雨",
        63: "雨",
        65: "強い雨",
        71: "弱い雪",
        73: "雪",
        75: "強い雪",
        80: "弱いにわか雨",
        81: "にわか雨",
        82: "強いにわか雨",
        95: "雷雨",
        96: "雷雨",
        99: "強い雷雨"
      };

      return map[code] || `天気${code}`;
    }

    function formatHour(iso) {
      const [, time] = iso.split("T");
      const [hh] = time.split(":");
      return `${Number(hh)}時`;
    }

    function formatMonthDayHour(iso) {
      const [date, time] = iso.split("T");
      const [, m, d] = date.split("-");
      const [hh] = time.split(":");
      return `${Number(m)}/${Number(d)} ${Number(hh)}時`;
    }

    function nowJstDateString() {
      const jst = new Date(Date.now() + 9 * 60 * 60 * 1000);
      return jst.toISOString().slice(0, 10);
    }

    function currentJstHourIso() {
      const jst = new Date(Date.now() + 9 * 60 * 60 * 1000);
      jst.setUTCMinutes(0, 0, 0);
      return jst.toISOString().slice(0, 13) + ":00";
    }

    function showError(message) {
      const box = document.getElementById("errorBox");
      box.textContent = message;
      box.style.display = "block";
    }

    function hideError() {
      const box = document.getElementById("errorBox");
      box.textContent = "";
      box.style.display = "none";
    }

    function gustClass(gust) {
      if (gust >= 20) return "gust-red";
      if (gust >= 15) return "gust-yellow";
      return "";
    }

    function gustLabel(gust) {
      if (gust >= 20) return `🟥 ${gust.toFixed(1)}`;
      if (gust >= 15) return `🟨 ${gust.toFixed(1)}`;
      return gust.toFixed(1);
    }

    function buildTodayItems(hourly) {
      const today = nowJstDateString();
      const items = [];

      for (let i = 0; i < hourly.time.length; i++) {
        const t = hourly.time[i];

        if (t.startsWith(today)) {
          items.push({
            time: t,
            temp: hourly.temperature_2m[i],
            rain: hourly.precipitation[i],
            rainProb: hourly.precipitation_probability[i],
            wind: hourly.wind_speed_10m[i],
            gust: hourly.wind_gusts_10m[i]
          });
        }
      }

      return items;
    }

    function buildNext24Items(hourly) {
      const startIso = currentJstHourIso();
      const items = [];

      for (let i = 0; i < hourly.time.length; i++) {
        const t = hourly.time[i];

        if (t >= startIso) {
          items.push({
            time: t,
            wind: hourly.wind_speed_10m[i],
            gust: hourly.wind_gusts_10m[i]
          });
        }

        if (items.length >= 24) break;
      }

      return items;
    }

    function setChartDefaults() {
      Chart.defaults.color = "#cbd5e1";
      Chart.defaults.borderColor = "rgba(148, 163, 184, 0.25)";
      Chart.defaults.font.family =
        'system-ui, -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif';
    }

    function renderTempRainChart(items) {
      const canvas = document.getElementById("tempRainChart");
      const labels = items.map(item => formatHour(item.time));

      if (tempRainChart) {
        tempRainChart.destroy();
      }

      tempRainChart = new Chart(canvas, {
        data: {
          labels,
          datasets: [
            {
              type: "line",
              label: "気温 ℃",
              data: items.map(item => item.temp),
              borderColor: "#f97316",
              backgroundColor: "rgba(249, 115, 22, 0.15)",
              yAxisID: "yTemp",
              tension: 0.35,
              pointRadius: 2
            },
            {
              type: "bar",
              label: "降水量 mm",
              data: items.map(item => item.rain),
              backgroundColor: "rgba(56, 189, 248, 0.65)",
              borderColor: "#38bdf8",
              yAxisID: "yRain"
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: {
            mode: "index",
            intersect: false
          },
          plugins: {
            legend: {
              position: "top",
              labels: {
                boxWidth: 12,
                boxHeight: 12
              }
            },
            tooltip: {
              callbacks: {
                label: function(context) {
                  if (context.dataset.yAxisID === "yTemp") {
                    return `気温 ${Number(context.raw).toFixed(1)}℃`;
                  }
                  return `降水量 ${Number(context.raw).toFixed(1)}mm`;
                }
              }
            }
          },
          scales: {
            x: {
              ticks: {
                maxTicksLimit: 8
              }
            },
            yTemp: {
              type: "linear",
              position: "left",
              title: {
                display: true,
                text: "℃"
              }
            },
            yRain: {
              type: "linear",
              position: "right",
              beginAtZero: true,
              title: {
                display: true,
                text: "mm"
              },
              grid: {
                drawOnChartArea: false
              }
            }
          }
        }
      });
    }

    function renderWindChart(items) {
      const canvas = document.getElementById("windChart");
      const labels = items.map(item => formatHour(item.time));

      if (windChart) {
        windChart.destroy();
      }

      windChart = new Chart(canvas, {
        type: "line",
        data: {
          labels,
          datasets: [
            {
              label: "平均風速 m/s",
              data: items.map(item => item.wind),
              borderColor: "#38bdf8",
              backgroundColor: "rgba(56, 189, 248, 0.15)",
              tension: 0.35,
              pointRadius: 2
            },
            {
              label: "突風 m/s",
              data: items.map(item => item.gust),
              borderColor: "#facc15",
              backgroundColor: "rgba(250, 204, 21, 0.12)",
              tension: 0.35,
              pointRadius: 2
            },
            {
              label: "警戒 15m/s",
              data: items.map(() => 15),
              borderColor: "rgba(250, 204, 21, 0.8)",
              borderDash: [6, 6],
              pointRadius: 0
            },
            {
              label: "停止目安 20m/s",
              data: items.map(() => 20),
              borderColor: "rgba(248, 113, 113, 0.85)",
              borderDash: [6, 6],
              pointRadius: 0
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: {
            mode: "index",
            intersect: false
          },
          plugins: {
            legend: {
              position: "top",
              labels: {
                boxWidth: 12,
                boxHeight: 12
              }
            },
            tooltip: {
              callbacks: {
                label: function(context) {
                  return `${context.dataset.label} ${Number(context.raw).toFixed(1)}`;
                }
              }
            }
          },
          scales: {
            x: {
              ticks: {
                maxTicksLimit: 8
              }
            },
            y: {
              beginAtZero: true,
              suggestedMax: 25,
              title: {
                display: true,
                text: "m/s"
              }
            }
          }
        }
      });
    }

    function renderForecastTable(items) {
      const rows = document.getElementById("forecastRows");
      rows.innerHTML = "";

      for (const item of items) {
        const tr = document.createElement("tr");
        const cls = gustClass(item.gust);

        tr.innerHTML = `
          <td>${formatMonthDayHour(item.time)}</td>
          <td>
            ${item.wind.toFixed(1)}
            <div class="bar-wrap">
              <div class="bar" style="width:${Math.min(item.wind / 20 * 100, 100)}%"></div>
            </div>
          </td>
          <td class="${cls}">${gustLabel(item.gust)}</td>
        `;

        rows.appendChild(tr);
      }
    }

    async function loadWeather() {
      hideError();

      try {
        const url =
          `https://api.open-meteo.com/v1/forecast` +
          `?latitude=${LAT}&longitude=${LON}` +
          `&current=temperature_2m,weather_code,wind_speed_10m,wind_direction_10m,wind_gusts_10m` +
          `&hourly=temperature_2m,precipitation,precipitation_probability,weather_code,wind_speed_10m,wind_direction_10m,wind_gusts_10m` +
          `&wind_speed_unit=ms` +
          `&timezone=Asia%2FTokyo` +
          `&forecast_days=3`;

        const res = await fetch(url);

        if (!res.ok) {
          throw new Error(`Open-Meteo API error: ${res.status}`);
        }

        const data = await res.json();

        const wind = data.current.wind_speed_10m;
        const gust = data.current.wind_gusts_10m;
        const dir = data.current.wind_direction_10m;
        const temp = data.current.temperature_2m;
        const weather = data.current.weather_code;

        document.getElementById("currentWind").textContent = wind.toFixed(1);
        document.getElementById("currentGust").textContent = gust.toFixed(1);
        document.getElementById("currentDir").textContent = degToDir(dir);
        document.getElementById("currentTemp").textContent = temp.toFixed(1);
        document.getElementById("currentWeather").textContent = weatherText(weather);
        document.getElementById("updatedAt").textContent =
          new Date().toLocaleString("ja-JP");

        const risk = judgeRisk(wind, gust);
        const riskBox = document.getElementById("riskBox");
        riskBox.textContent = risk.text;
        riskBox.className = `risk ${risk.cls}`;

        const todayItems = buildTodayItems(data.hourly);
        const next24Items = buildNext24Items(data.hourly);

        setChartDefaults();
        renderTempRainChart(todayItems);
        renderWindChart(todayItems);
        renderForecastTable(next24Items);

      } catch (err) {
        console.error(err);
        showError(
          "天気データの取得に失敗しました。時間をおいて再読み込みしてください。\n" +
          String(err.message || err)
        );
      }
    }

    loadWeather();
  </script>
</body>
</html>
